# MSubGA 的 nginx server 块。
# 追加到现有配置里即可（比如 /etc/nginx/conf.d/msubga.conf），
# 不带 default_server，不会影响同一个 23333 端口上的其他子域名。
#
#   nginx -t && systemctl reload nginx

server {
    # nginx 1.25.1+ 可以写成 `listen 23333 ssl;` 加单独一行 `http2 on;`
    listen      23333 ssl http2;
    listen [::]:23333 ssl http2;
    server_name MSubGA.20020527.xyz;

    ssl_certificate     /etc/nginx/certs/20020527.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/20020527.xyz.key;

    # 导入节点时可能一次粘几千行
    client_max_body_size 8m;

    access_log /var/log/nginx/msubga.access.log;
    error_log  /var/log/nginx/msubga.error.log;

    location / {
        proxy_pass http://127.0.0.1:27981;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 服务端靠这个头判断要不要给会话 cookie 打 Secure 标记。
        # 少了它，HTTPS 站点的 cookie 会当成明文连接签发。
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # 测速进度是 SSE 长连接。nginx 默认会缓冲响应，
    # 结果就是进度条一直不动，等整批测完才一次性跳到 100%。
    location /api/latency/stream {
        proxy_pass http://127.0.0.1:27981;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering          off;
        proxy_cache              off;
        chunked_transfer_encoding off;
        proxy_read_timeout       1h;
    }
}
